{% if messages %}
  <ul style="list-style: none; padding: 0; margin: 0 0 1rem 0;">
    {% for message in messages %}
      <li style="padding: 0.75rem 1rem; border: 1px solid var(--border); background: #fff; border-radius: 10px; margin-bottom: 0.5rem;">
        {{ message }}
      </li>
    {% endfor %}
  </ul>
{% endif %}
