{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
  <div class="card" style="max-width: 520px; margin: 0 auto;">
    <h1 style="margin-top: 0;">Login</h1>

    <form method="post" novalidate>
      {% csrf_token %}

      {{ form.non_field_errors }}
      {{ form.as_p }}

      <button
        type="submit"
        style="background: #111827; color: #fff; border: 0; padding: 0.7rem 1rem; border-radius: 10px; cursor: pointer;"
      >
        Login
      </button>
    </form>
  </div>
{% endblock %}
